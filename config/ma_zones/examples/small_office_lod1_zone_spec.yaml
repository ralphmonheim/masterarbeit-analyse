assumptions:
  - assumption_id: "SMALLOFFICE-ZONE-MERGE-001"
    location: "zones.0"
    text: "Die 29 IFC-Raeume werden nur fuer den ersten lauffaehigen LoD-1-Slice aggregiert. Die raumweise Einraum-Einzonen-Aufloesung bleibt der naechste fachliche Ausbauschritt."
  - assumption_id: "SMALLOFFICE-ZONE-TEMPERATURE-001"
    location: "zones.0"
    text: "20 C Heizen und 26 C Kuehlen sind transparente Betriebsannahmen fuer leichte sitzende Bueronutzung. ASR A3.5 stuetzt 20 C als Mindesttemperatur und 26 C als sommerliche Schwelle, jedoch keinen ganzjaehrigen Komfortnachweis."
  - assumption_id: "SMALLOFFICE-ZONE-AIR-001"
    location: "zones.0.minimum_air_change_rate_1_h"
    text: "0.7 1/h ist eine vorlaeufige Projektannahme fuer den Demo-Lauf. ASR A3.6 stuetzt das Ziel von maximal 1000 ppm CO2, nicht diesen pauschalen Luftwechsel; die spaetere Validierung erfolgt belegungs- und CO2-basiert."
  - assumption_id: "SMALLOFFICE-ZONE-LOADS-001"
    location: "usage_profiles.0"
    text: "8-18 Uhr an 5 Tagen, 12 m2/Person, 8 W/m2 Beleuchtung und 10 W/m2 Geraete sind versionierte Projektannahmen aus dem bestehenden LoD-1-Referenzfall. Bezugsflaeche, Gleichzeitigkeitsprofile und Nutzungsgruppen werden spaeter validiert."
