assumptions:
  - assumption_id: "SMALLOFFICE-BLD-SOURCE-001"
    location: "spaces.0"
    text: "Strikt synthetischer SmallOffice-Referenzfall ohne IFC-IDs, reale Raumdaten oder Quellgeometrie."
  - assumption_id: "SMALLOFFICE-BLD-GEOMETRY-001"
    location: "building"
    text: "Laenge, Breite und Hoehe bilden eine rechteckige LoD-1-Ersatzgeometrie. Die Grundflaeche entspricht naeherungsweise der halben Netto-Raumflaeche; die Werte sind vor Geometrieauswertungen zu validieren."
  - assumption_id: "SMALLOFFICE-BLD-ENVELOPE-001"
    location: "simple_envelope"
    text: "U-Werte sind Demo-Baselinewerte der GEG-Anlage 2 fuer ein Nichtwohn-Referenzgebaeude mit Heiz-Solltemperatur >= 19 C; sie sind keine IFC-Istwerte."
  - assumption_id: "SMALLOFFICE-BLD-GLAZING-001"
    location: "simple_envelope.window_u_value_w_m2k"
    text: "Fuer die Verglasung wird zusaetzlich g = 0.60 als GEG-Referenzannahme gefuehrt. Das aktuelle LoD-1-Fachmodell besitzt noch kein eigenes g-Wert-Feld."
  - assumption_id: "SMALLOFFICE-BLD-SHADING-001"
    location: "shading_devices"
    text: "Fuer den lauffaehigen Referenzfall wird konzeptioneller aussenliegender Sonnenschutz angenommen; bei aktivem Sonnenschutz gilt g = 0.35 als Sensitivitaetswert. Eine bauteilscharfe Zuordnung folgt nach Geometrievalidierung."
  - assumption_id: "SMALLOFFICE-BLD-ORIENTATION-001"
    location: "building.north_angle_deg"
    text: "Nordwinkel 0 Grad stammt aus dem Quellpaket. Einzelne Bauteilorientierungen bleiben unaufgeloest; fuer LoD-1 wird eine gleichmaessige Verteilung auf die vier Haupthimmelsrichtungen angenommen."
  - assumption_id: "SMALLOFFICE-BLD-VALIDATION-001"
    location: "model_version"
    text: "Alle angenommenen Geometrie-, Huell-, Verglasungs- und Verschattungswerte muessen in einer spaeteren Fachphase gegen IFC, Projektunterlagen oder freigegebene Berechnungen validiert werden."
